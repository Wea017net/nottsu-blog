<footer class="{{ .Site.Params.base_color }} text-white p-6">
  {{ if .Site.Menus.foot }}
    <div
      class="flex justify-center w-full md:flex md:flex-row sm:items-center sm:w-auto mb-4"
    >
      <div>
        {{ range .Site.Menus.foot }}
          <a
            href="{{ .URL }}"
            class="no-underline block sm:inline-block duration-200 text-white hover:opacity-50"
          >
            {{ .Name }}
          </a>
        {{ end }}
      </div>
    </div>
  {{ end }}
  <div class="container max-w-7xl mr-auto ml-auto">
    <p>
      &copy;
      {{ now.Year }}
      <a href="{{ .Site.Home.RelPermalink }}" class="duration-200 hover:opacity-50"
        >{{ .Site.Title }}</a
      >
    </p>
    <p>
      Powered by
      <a href="https://gohugo.io/" class="duration-200 hover:opacity-50">Hugo</a
      >, Theme
      <a
        href="https://github.com/opera7133/Blonde"
        class="duration-200 hover:opacity-50"
        >Blonde</a
      >.
    </p>
    <p class="text-xs mt-1 opacity-80 leading-relaxed">
      Font: <a href="https://seed.line.me/" class="duration-200 hover:opacity-50">LINE Seed JP</a> (SIL OFL 1.1)<br>
      Library: <a href="https://github.com/google/budoux" class="duration-200 hover:opacity-50">BudouX</a> (Apache-2.0)
    </p>
  </div>
  {{ if .Site.Params.ad.googleAdSense }}
  <script>
    (function (window, document) {
      function main() {
        var ad = document.createElement('script');
        ad.async = true;
        ad.src = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client={{ .Site.Params.ad.googleAdSense }}';
        ad.crossOrigin = "anonymous"
        var sc = document.getElementsByTagName('script')[0];
        sc.parentNode.insertBefore(ad, sc);
      }

      var lazyLoad = false;
      function onLazyLoad() {
        if (lazyLoad === false) {
          lazyLoad = true;
          window.removeEventListener('scroll', onLazyLoad);
          window.removeEventListener('mousemove', onLazyLoad);
          window.removeEventListener('mousedown', onLazyLoad);
          window.removeEventListener('touchstart', onLazyLoad);
          window.removeEventListener('keydown', onLazyLoad);
          main();
        }
      }
      window.addEventListener('scroll', onLazyLoad);
      window.addEventListener('mousemove', onLazyLoad);
      window.addEventListener('mousedown', onLazyLoad);
      window.addEventListener('touchstart', onLazyLoad);
      window.addEventListener('keydown', onLazyLoad);
      window.addEventListener('load', function () {
        if (window.pageYOffset) {
          onLazyLoad();
          window.setTimeout(onLazyLoad, 3000)
        }
      });
    })(window, document);
  </script>
  <script>
    // Ensure visible ellipsis for elements with .truncate-1 when CSS fallback doesn't show it.
    (function () {
      function applyEllipsis(el) {
        if (!el) return;
        var full = el.textContent.trim();
        // if not overflowing, nothing to do
        if (el.scrollWidth <= el.clientWidth) return;
        var lo = 0, hi = full.length, best = '';
        while (lo <= hi) {
          var mid = Math.floor((lo + hi) / 2);
          el.textContent = full.slice(0, mid) + '…';
          if (el.scrollWidth <= el.clientWidth) {
            best = el.textContent;
            lo = mid + 1;
          } else {
            hi = mid - 1;
          }
        }
        if (best) el.textContent = best;
      }

      function run() {
        var nodes = document.querySelectorAll('.truncate-1');
        nodes.forEach(function (el) {
          // reset to full text first (in case of resize)
          var original = el.getAttribute('data-original-title');
          if (!original) {
            el.setAttribute('data-original-title', el.textContent.trim());
          } else {
            el.textContent = original;
          }
          // apply after a tick to ensure layout
          setTimeout(function () { applyEllipsis(el); }, 0);
        });
      }

      window.addEventListener('load', run);
      window.addEventListener('resize', function () { setTimeout(run, 100); });
    })();
  </script>
  {{ end }}
  <script>
    function setDarkModeIcons(isDark) {
      var moonIcon1 = document.getElementById("icon-moon");
      var sunIcon1 = document.getElementById("icon-sun");
      var moonIcon2 = document.getElementById("icon2-moon");
      var sunIcon2 = document.getElementById("icon2-sun");
      if (moonIcon1) moonIcon1.classList.toggle("hidden", isDark);
      if (sunIcon1) sunIcon1.classList.toggle("hidden", !isDark);
      if (moonIcon2) moonIcon2.classList.toggle("hidden", isDark);
      if (sunIcon2) sunIcon2.classList.toggle("hidden", !isDark);
    }
    // On page load or when changing themes, best to add inline in `head` to avoid FOUC
    if (
      document.documentElement.classList.contains("dark") ||
      localStorage.theme === "dark" ||
      (!("theme" in localStorage) &&
        window.matchMedia("(prefers-color-scheme: dark)").matches)
    ) {
      setDarkModeIcons(true);
      document.documentElement.classList.add("dark");
    } else {
      setDarkModeIcons(false);
      document.documentElement.classList.remove("dark");
    }
    function toggleDarkMode() {
      if (document.documentElement.classList.contains("dark")) {
        setDarkModeIcons(false);
        document.documentElement.classList.remove("dark");
        localStorage.theme = "light";
      } else {
        setDarkModeIcons(true);
        document.documentElement.classList.add("dark");
        localStorage.theme = "dark";
      }
    }
  </script>
  <script>
    // Lightbox script for article images
    (function(){
      function createOverlay(){
        var overlay = document.createElement('div');
        overlay.className = 'lightbox-overlay';
        overlay.innerHTML = '<img alt="" /><button class="close-btn" aria-label="閉じる">×</button>';
        document.body.appendChild(overlay);
        return overlay;
      }

      var overlay = createOverlay();
      var overlayImg = overlay.querySelector('img');
      var closeBtn = overlay.querySelector('.close-btn');

      function openLightbox(src, alt){
        overlayImg.src = src;
        overlayImg.alt = alt || '';
        overlay.classList.add('open');
        document.documentElement.style.overflow = 'hidden';
      }

      function closeLightbox(){
        overlay.classList.remove('open');
        overlayImg.src = '';
        document.documentElement.style.overflow = '';
      }

      overlay.addEventListener('click', function(e){
        if (e.target === overlay || e.target === overlayImg) closeLightbox();
      });
      if (closeBtn) closeBtn.addEventListener('click', function(e){ e.stopPropagation(); closeLightbox(); });

      window.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeLightbox(); });

      function init(){
        // Deduplicate: if a rendered image (prose-img) is immediately followed by a <figure> containing the same src,
        // move the lightbox class to the figure image and remove the redundant image.
        function dedupeImages(){
          // Remove plain-image followed by figure with same src
          var imgs = document.querySelectorAll('.prose img');
          imgs.forEach(function(img){
            var next = img.nextElementSibling;
            if (!next) return;
            if (next.tagName === 'FIGURE'){
              var figimg = next.querySelector('img');
              if (!figimg) return;
              var a = img.currentSrc || img.src;
              var b = figimg.currentSrc || figimg.src;
              if (a && b && a === b){
                // keep the figure's image, remove the inline img
                figimg.classList.add('lightbox-trigger','prose-img');
                img.remove();
              }
            }
          });
          // Handle duplicate FIGUREs (both containing same image)
          var figs = document.querySelectorAll('figure');
          figs.forEach(function(fig){
            var next = fig.nextElementSibling;
            if (!next || next.tagName !== 'FIGURE') return;
            var imgA = fig.querySelector('img');
            var imgB = next.querySelector('img');
            if (!imgA || !imgB) return;
            var a = imgA.currentSrc || imgA.src;
            var b = imgB.currentSrc || imgB.src;
            if (a && b && a === b){
              imgB.classList.add('lightbox-trigger','prose-img');
              fig.remove();
            }
          });
        }
        dedupeImages();

        // Reveal images now that dedupe ran
        document.documentElement.classList.remove('images-hidden');

        // Attach lightbox handlers to images inside .prose
        var imgs2 = document.querySelectorAll('.prose img');
        imgs2.forEach(function(img){
          // mark as prose-img for consistency
          img.classList.add('prose-img');
          img.classList.add('lightbox-trigger');
          img.style.cursor = 'zoom-in';
          img.addEventListener('click', function(){ openLightbox(img.currentSrc || img.src, img.alt); });
        });
      }

      window.addEventListener('load', init);
      document.addEventListener('DOMContentLoaded', init);
    })();
  </script>
</footer>
